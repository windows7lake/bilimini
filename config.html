<!DOCTYPE html>
<html lang="cn">
<head>
  <meta charset="UTF-8">
  <title>Bilibili v.mini 设置中心</title>
  <link rel="stylesheet" href="css/child-window.css">
</head>
<body>
  <div id="wrapper">
    <div id="config-dragzone">设置<span id="close" @click="closeWindow">x</span></div>
    <div id="config-list" class="list">
      <!-- 不透明度 -->
      <p class="list-title">窗口不透明度</p>
      <div class="item item-range"><input type="range" class="range" v-model="opacity" min="0.1" max="0.9999" step="0.01"></div>
      <!-- 页面饱和度 -->
      <p class="list-title">页面饱和度 <span class="range-value">{{ Math.round(saturation * 100) }}%</span></p>
      <div class="item item-range"><input type="range" class="range" v-model.number="saturation" min="0" max="2" step="0.05"></div>
      <!-- 隐藏窗口时是否暂停 -->
      <p class="list-title">隐藏窗口时自动暂停</p>
      <label class="item" :class="{active: autoPause}">
          <input type="checkbox" class="checkbox" v-model="autoPause" /> <span style="vertical-align: middle;">隐藏时暂停，显示时播放</span>
      </label>
      <div class="shortcut-grid">
        <div class="shortcut-setting">
          <p class="list-title">老板键</p>
          <div class="item"><input type="text" class="input" v-model="hideShortcut"><span class="btn btn-submit" @click="saveHideShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">播放/暂停快捷键</p>
          <div class="item"><input type="text" class="input" v-model="playPauseShortcut"><span class="btn btn-submit" @click="savePlayPauseShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">网页全屏快捷键</p>
          <div class="item"><input type="text" class="input" v-model="webFullscreenShortcut"><span class="btn btn-submit" @click="saveWebFullscreenShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">窗口聚焦快捷键</p>
          <div class="item"><input type="text" class="input" v-model="focusWindowShortcut"><span class="btn btn-submit" @click="saveFocusWindowShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">播放历史快捷键</p>
          <div class="item"><input type="text" class="input" v-model="historyShortcut"><span class="btn btn-submit" @click="saveHistoryShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">前进快捷键</p>
          <div class="item"><input type="text" class="input" v-model="forwardShortcut"><span class="btn btn-submit" @click="saveForwardShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">后退快捷键</p>
          <div class="item"><input type="text" class="input" v-model="backShortcut"><span class="btn btn-submit" @click="saveBackShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">我的收藏页快捷键</p>
          <div class="item"><input type="text" class="input" v-model="favoriteShortcut"><span class="btn btn-submit" @click="saveFavoriteShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">刷新页面快捷键</p>
          <div class="item"><input type="text" class="input" v-model="reloadShortcut"><span class="btn btn-submit" @click="saveReloadShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">提高播放倍速快捷键</p>
          <div class="item"><input type="text" class="input" v-model="increasePlaybackRateShortcut"><span class="btn btn-submit" @click="saveIncreasePlaybackRateShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">降低播放倍速快捷键</p>
          <div class="item"><input type="text" class="input" v-model="decreasePlaybackRateShortcut"><span class="btn btn-submit" @click="saveDecreasePlaybackRateShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">缩小页面快捷键</p>
          <div class="item"><input type="text" class="input" v-model="zoomOutShortcut"><span class="btn btn-submit" @click="saveZoomOutShortcut">确定</span></div>
        </div>
        <div class="shortcut-setting">
          <p class="list-title">放大页面快捷键</p>
          <div class="item"><input type="text" class="input" v-model="zoomInShortcut"><span class="btn btn-submit" @click="saveZoomInShortcut">确定</span></div>
        </div>
      </div>
      <!-- 代理 -->
      <p class="list-title">代理设置</p>
      <div class="item">
        <input type="text" class="input" v-model="proxy" placeholder="scheme://host:port">
        <span class="btn btn-submit" @click="saveProxy">确定</span>
      </div>
    </div>
  </div>

  <script src="js/vue.min.js"></script>
  <script>
    const ipc = require('electron').ipcRenderer;
    const utils = require('./js/utils.js');
    const config = utils.config;

    var lastOpacity = 1;

    const v = new Vue({
      el: '#wrapper',
      data: {
        opacity: 1,
        saturation: 1,
        hideShortcut: '',
        playPauseShortcut: '',
        webFullscreenShortcut: '',
        focusWindowShortcut: '',
        historyShortcut: '',
        forwardShortcut: '',
        backShortcut: '',
        favoriteShortcut: '',
        reloadShortcut: '',
        increasePlaybackRateShortcut: '',
        decreasePlaybackRateShortcut: '',
        zoomOutShortcut: '',
        zoomInShortcut: '',
        proxy: '',
        autoPause: false,
      },
      watch: {
        opacity(val) {
          // 在不透明和透明间切换的瞬间，需要重新创建主窗口并切换模式
          if( lastOpacity == 1 && val < 1 || lastOpacity < 1 && val == 1 ) {
            ipc.send('recreate-main-window', val);
          } else {
            ipc.send('set-opacity', val);
          }
          lastOpacity = val;
          config.set('opacity', val);
        },
        saturation(val) {
          config.set('saturation', val);
          ipc.send('set-saturation', val);
        },
        autoPause(val) {
          config.set('autoPause', val);
          ipc.send('set-auto-pause', val);
        }
      },
      methods: {
        closeWindow() {
          ipc.send('hide-current-window');
        },
        saveShortcut(key, property, eventName) {
          const rawShortcut = this[property].replace(/\s+/g, '');
          // “+” 位于 Shift+=；接受用户输入的 Alt++ / Alt + +。
          const normalizedShortcut = rawShortcut.endsWith('++')
            ? `${rawShortcut.slice(0, -1)}Shift+=`
            : rawShortcut.toLowerCase() === 'alt+plus'
              ? 'Alt+Shift+='
              : this[property];
          var lastShortcut = config.get(key),
              curShortcut = normalizedShortcut.split('+').map((c) => {
                let _c = c.trim().toLowerCase().split('');
                _c[0] = _c[0].toUpperCase();
                return _c.join('');
              }).join('+');
          this[property] = curShortcut.replace(/\+/g, ' + ');
          // 由主进程实际注册并验证快捷键：避免第三方语法解析器落后于
          // Electron 的 Accelerator 规范；失败时会恢复为 lastShortcut。
          ipc.send(eventName, lastShortcut, curShortcut);
        },
        saveHideShortcut() {
          this.saveShortcut('hideShortcut', 'hideShortcut', 'update-hide-shortcut');
        },
        savePlayPauseShortcut() {
          this.saveShortcut('playPauseShortcut', 'playPauseShortcut', 'update-play-pause-shortcut');
        },
        saveWebFullscreenShortcut() {
          this.saveShortcut('webFullscreenShortcut', 'webFullscreenShortcut', 'update-web-fullscreen-shortcut');
        },
        saveFocusWindowShortcut() {
          this.saveShortcut('focusWindowShortcut', 'focusWindowShortcut', 'update-focus-window-shortcut');
        },
        saveHistoryShortcut() {
          this.saveShortcut('historyShortcut', 'historyShortcut', 'update-history-shortcut');
        },
        saveForwardShortcut() {
          this.saveShortcut('forwardShortcut', 'forwardShortcut', 'update-forward-shortcut');
        },
        saveBackShortcut() {
          this.saveShortcut('backShortcut', 'backShortcut', 'update-back-shortcut');
        },
        saveFavoriteShortcut() {
          this.saveShortcut('favoriteShortcut', 'favoriteShortcut', 'update-favorite-shortcut');
        },
        saveReloadShortcut() {
          this.saveShortcut('reloadShortcut', 'reloadShortcut', 'update-reload-shortcut');
        },
        saveIncreasePlaybackRateShortcut() {
          this.saveShortcut('increasePlaybackRateShortcut', 'increasePlaybackRateShortcut', 'update-increase-playback-rate-shortcut');
        },
        saveDecreasePlaybackRateShortcut() {
          this.saveShortcut('decreasePlaybackRateShortcut', 'decreasePlaybackRateShortcut', 'update-decrease-playback-rate-shortcut');
        },
        saveZoomOutShortcut() {
          this.saveShortcut('zoomOutShortcut', 'zoomOutShortcut', 'update-zoom-out-shortcut');
        },
        saveZoomInShortcut() {
          this.saveShortcut('zoomInShortcut', 'zoomInShortcut', 'update-zoom-in-shortcut');
        },
        saveProxy() {
          config.set('proxy', this.proxy);
          ipc.send('set-proxy');
        }
      },
      mounted() {
        const storedOpacity = Number(config.get('opacity'));
        const opacity = Math.min(storedOpacity, 0.9999);
        this.opacity = lastOpacity = opacity;
        // 主进程会在创建窗口前迁移旧配置；这里仅保持设置页显示一致。
        if( storedOpacity !== opacity ) {
          config.set('opacity', opacity);
        }
        const storedSaturation = Number(config.get('saturation'));
        this.saturation = Number.isFinite(storedSaturation) ? Math.max(0, Math.min(2, storedSaturation)) : 1;
        this.hideShortcut = config.get('hideShortcut');
        this.playPauseShortcut = config.get('playPauseShortcut');
        this.webFullscreenShortcut = config.get('webFullscreenShortcut');
        this.focusWindowShortcut = config.get('focusWindowShortcut');
        this.historyShortcut = config.get('historyShortcut');
        this.forwardShortcut = config.get('forwardShortcut');
        this.backShortcut = config.get('backShortcut');
        this.favoriteShortcut = config.get('favoriteShortcut');
        this.reloadShortcut = config.get('reloadShortcut');
        this.increasePlaybackRateShortcut = config.get('increasePlaybackRateShortcut');
        this.decreasePlaybackRateShortcut = config.get('decreasePlaybackRateShortcut');
        this.zoomOutShortcut = config.get('zoomOutShortcut');
        this.zoomInShortcut = config.get('zoomInShortcut');
        this.proxy = config.get('proxy');
        this.autoPause = config.get('autoPause');
      }
    });

    ipc.on('shortcut-update-failed', (ev, { key, shortcut }) => {
      const properties = {
        hideShortcut: 'hideShortcut',
        playPauseShortcut: 'playPauseShortcut',
        webFullscreenShortcut: 'webFullscreenShortcut',
        focusWindowShortcut: 'focusWindowShortcut',
        historyShortcut: 'historyShortcut',
        forwardShortcut: 'forwardShortcut',
        backShortcut: 'backShortcut',
        favoriteShortcut: 'favoriteShortcut',
        reloadShortcut: 'reloadShortcut',
        increasePlaybackRateShortcut: 'increasePlaybackRateShortcut',
        decreasePlaybackRateShortcut: 'decreasePlaybackRateShortcut',
        zoomOutShortcut: 'zoomOutShortcut',
        zoomInShortcut: 'zoomInShortcut'
      };
      const property = properties[key];
      v[property] = shortcut.replace(/\+/g, ' + ');
      config.set(key, shortcut);
    });

    window.onerror = function(err, f, line) {
      var id = f.split('/');
      utils.error(`${id[id.length-1]} : Line ${line}\n> ${err}`);
    }

    if( !process.platform.indexOf('win') ) {
      document.querySelectorAll('input[type=text]').forEach((input) => {
        input.style.width = '70%';
      });
    }
  </script>
</body>
</html>
