<!DOCTYPE html>
<html lang="cn">
<head>
  <meta charset="UTF-8">
  <title>Bilibili v.mini 设置中心</title>
  <link rel="stylesheet" href="css/child-window.css">
</head>
<body>
  <div id="wrapper">
    <span id="close" @click="closeWindow">x</span>
    <div id="config-list" class="list">
      <!-- 不透明度 -->
      <p class="list-title">窗口不透明度</p>
      <div class="item item-range"><input type="range" class="range" v-model="opacity" min="0.1" max="0.9999" step="0.01"></div>
      <!-- 隐藏窗口时是否暂停 -->
      <p class="list-title">隐藏窗口时自动暂停</p>
      <label class="item" :class="{active: autoPause}">
          <input type="checkbox" class="checkbox" v-model="autoPause" /> <span style="vertical-align: middle;">隐藏时暂停，显示时播放</span>
      </label>
      <!-- 老板键 -->
      <p class="list-title">老板键</p>
      <div class="item">
        <input type="text" class="input" v-model="hideShortcut">
        <span class="btn btn-submit" @click="saveHideShortcut">确定</span>
      </div>
      <!-- 播放/暂停快捷键 -->
      <p class="list-title">播放/暂停快捷键</p>
      <div class="item">
        <input type="text" class="input" v-model="playPauseShortcut">
        <span class="btn btn-submit" @click="savePlayPauseShortcut">确定</span>
      </div>
      <!-- 网页全屏快捷键 -->
      <p class="list-title">网页全屏快捷键</p>
      <div class="item">
        <input type="text" class="input" v-model="webFullscreenShortcut">
        <span class="btn btn-submit" @click="saveWebFullscreenShortcut">确定</span>
      </div>
      <!-- 窗口聚焦快捷键 -->
      <p class="list-title">窗口聚焦快捷键</p>
      <div class="item">
        <input type="text" class="input" v-model="focusWindowShortcut">
        <span class="btn btn-submit" @click="saveFocusWindowShortcut">确定</span>
      </div>
      <!-- 播放历史快捷键 -->
      <p class="list-title">播放历史快捷键</p>
      <div class="item">
        <input type="text" class="input" v-model="historyShortcut">
        <span class="btn btn-submit" @click="saveHistoryShortcut">确定</span>
      </div>
      <!-- 代理 -->
      <p class="list-title">代理设置</p>
      <div class="item">
        <input type="text" class="input" v-model="proxy" placeholder="scheme://host:port">
        <span class="btn btn-submit" @click="saveProxy">确定</span>
      </div>
    </div>
  </div>

  <script src="js/vue.min.js"></script>
  <script>
    const ipc = require('electron').ipcRenderer;
    const utils = require('./js/utils.js');
    const config = utils.config;

    var lastOpacity = 1;

    const v = new Vue({
      el: '#wrapper',
      data: {
        opacity: 1,
        hideShortcut: '',
        playPauseShortcut: '',
        webFullscreenShortcut: '',
        focusWindowShortcut: '',
        historyShortcut: '',
        proxy: '',
        autoPause: false,
      },
      watch: {
        opacity(val) {
          // 在不透明和透明间切换的瞬间，需要重新创建主窗口并切换模式
          if( lastOpacity == 1 && val < 1 || lastOpacity < 1 && val == 1 ) {
            ipc.send('recreate-main-window', val);
          } else {
            ipc.send('set-opacity', val);
          }
          lastOpacity = val;
          config.set('opacity', val);
        },
        autoPause(val) {
          config.set('autoPause', val);
          ipc.send('set-auto-pause', val);
        }
      },
      methods: {
        closeWindow() {
          ipc.send('hide-current-window');
        },
        saveShortcut(key, property, eventName) {
          var lastShortcut = config.get(key),
              curShortcut = this[property].split('+').map((c) => {
                let _c = c.trim().toLowerCase().split('');
                _c[0] = _c[0].toUpperCase();
                return _c.join('');
              }).join('+');
          this[property] = curShortcut.replace(/\+/g, ' + ');
          // 由主进程实际注册并验证快捷键：避免第三方语法解析器落后于
          // Electron 的 Accelerator 规范；失败时会恢复为 lastShortcut。
          ipc.send(eventName, lastShortcut, curShortcut);
        },
        saveHideShortcut() {
          this.saveShortcut('hideShortcut', 'hideShortcut', 'update-hide-shortcut');
        },
        savePlayPauseShortcut() {
          this.saveShortcut('playPauseShortcut', 'playPauseShortcut', 'update-play-pause-shortcut');
        },
        saveWebFullscreenShortcut() {
          this.saveShortcut('webFullscreenShortcut', 'webFullscreenShortcut', 'update-web-fullscreen-shortcut');
        },
        saveFocusWindowShortcut() {
          this.saveShortcut('focusWindowShortcut', 'focusWindowShortcut', 'update-focus-window-shortcut');
        },
        saveHistoryShortcut() {
          this.saveShortcut('historyShortcut', 'historyShortcut', 'update-history-shortcut');
        },
        saveProxy() {
          config.set('proxy', this.proxy);
          ipc.send('set-proxy');
        }
      },
      mounted() {
        const storedOpacity = Number(config.get('opacity'));
        const opacity = Math.min(storedOpacity, 0.9999);
        this.opacity = lastOpacity = opacity;
        // 主进程会在创建窗口前迁移旧配置；这里仅保持设置页显示一致。
        if( storedOpacity !== opacity ) {
          config.set('opacity', opacity);
        }
        this.hideShortcut = config.get('hideShortcut');
        this.playPauseShortcut = config.get('playPauseShortcut');
        this.webFullscreenShortcut = config.get('webFullscreenShortcut');
        this.focusWindowShortcut = config.get('focusWindowShortcut');
        this.historyShortcut = config.get('historyShortcut');
        this.proxy = config.get('proxy');
        this.autoPause = config.get('autoPause');
      }
    });

    ipc.on('shortcut-update-failed', (ev, { key, shortcut }) => {
      const properties = {
        hideShortcut: 'hideShortcut',
        playPauseShortcut: 'playPauseShortcut',
        webFullscreenShortcut: 'webFullscreenShortcut',
        focusWindowShortcut: 'focusWindowShortcut',
        historyShortcut: 'historyShortcut'
      };
      const property = properties[key];
      v[property] = shortcut.replace(/\+/g, ' + ');
      config.set(key, shortcut);
    });

    window.onerror = function(err, f, line) {
      var id = f.split('/');
      utils.error(`${id[id.length-1]} : Line ${line}\n> ${err}`);
    }

    if( !process.platform.indexOf('win') ) {
      document.querySelectorAll('input[type=text]').forEach((input) => {
        input.style.width = '70%';
      });
    }
  </script>
</body>
</html>
